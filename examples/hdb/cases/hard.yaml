- id: hard-top-flat-type-share-over750k-tampines-2024
  question: "Among flat types with at least 500 resale transactions in Tampines in 2024, which had the highest percentage of transactions priced at $750,000 or more? If tied, choose the alphabetically first flat type. Return the flat type."
  reference_sql: |
    SELECT flat_type
    FROM resale
    WHERE town = 'TAMPINES'
      AND month LIKE '2024-%'
    GROUP BY flat_type
    HAVING COUNT(*) >= 500
    ORDER BY
      100.0 * SUM(CASE WHEN resale_price >= 750000 THEN 1 ELSE 0 END) / COUNT(*) DESC,
      flat_type ASC
    LIMIT 1
  tags: [hard, conditional-aggregation, percentage, ranking]

