- id: hard-top-price-gainer-town-2022-2023
  question: "Comparing each town's average resale price (all flat types) in calendar year 2022 with its average in 2023, which town had the largest increase in dollars? Return only the town name."
  reference_sql: |
    WITH y22 AS (
      SELECT town, AVG(resale_price) AS p FROM resale
      WHERE month LIKE '2022-%' GROUP BY town
    ),
    y23 AS (
      SELECT town, AVG(resale_price) AS p FROM resale
      WHERE month LIKE '2023-%' GROUP BY town
    )
    SELECT y23.town FROM y22 JOIN y23 USING (town)
    ORDER BY y23.p - y22.p DESC
    LIMIT 1
  tags: [single-table, hard, multi-step, comparison]

- id: hard-share-5room-punggol-2024
  question: "In 2024, what percentage of resale transactions in Punggol were for 5-room flats? Return a number between 0 and 100."
  reference_sql: |
    SELECT 100.0 * SUM(CASE WHEN flat_type = '5 ROOM' THEN 1 ELSE 0 END) / COUNT(*)
    FROM resale
    WHERE town = 'PUNGGOL' AND month LIKE '2024-%'
  tags: [single-table, hard, multi-step, share]

- id: hard-distinct-streets-above-1m-2024
  question: "In 2024, how many distinct street names had at least one resale transaction priced strictly above $1,000,000? Return a single number."
  reference_sql: |
    SELECT COUNT(DISTINCT street_name) FROM resale
    WHERE resale_price > 1000000 AND month LIKE '2024-%'
  tags: [single-table, hard, multi-step, distinct-count]

- id: hard-towns-4room-avg-under-500k-2021
  question: "In 2021, which towns had an average 4-room resale price below $500,000? Return the town names, one per row, in alphabetical order."
  reference_sql: |
    SELECT town FROM resale
    WHERE flat_type = '4 ROOM' AND month LIKE '2021-%'
    GROUP BY town
    HAVING AVG(resale_price) < 500000
    ORDER BY town
  tags: [single-table, hard, multi-step, having]
  compare:
    ordered: true

