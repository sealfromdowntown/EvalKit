- id: hard-count-towns-high-avg-sqm-4room-2024
  question: "How many towns had an average price per square metre above $6,500 for 4 ROOM flats in 2024? Calculate price per square metre per transaction before averaging. Return a single number."
  reference_sql: |
    SELECT COUNT(*)
    FROM (
      SELECT town
      FROM resale
      WHERE flat_type = '4 ROOM'
        AND month LIKE '2024-%'
      GROUP BY town
      HAVING AVG(resale_price * 1.0 / floor_area_sqm) > 6500
    )
  tags: [hard, grouping, having, derived-metric]