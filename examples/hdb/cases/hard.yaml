- id: hard-bedok-4room-average-change-2019-2024
  question: "How much higher or lower was the average resale price of 4 ROOM flats in Bedok in 2024 than in 2019? Return the 2024 average minus the 2019 average, rounded to two decimal places."
  reference_sql: |
    SELECT ROUND(
      (SELECT AVG(resale_price)
       FROM resale
       WHERE town = 'BEDOK'
         AND flat_type = '4 ROOM'
         AND month LIKE '2024-%')
      -
      (SELECT AVG(resale_price)
       FROM resale
       WHERE town = 'BEDOK'
         AND flat_type = '4 ROOM'
         AND month LIKE '2019-%'),
      2
    )
  tags: [hard, date-range, comparison, scalar-subquery]

- id: hard-busiest-year-tampines-5room-2019-2024
